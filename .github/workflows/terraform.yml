name: "Terraform CI/CD Pipeline"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.0"

jobs:
  # ============================================================
  # Job 1: Terraform Plan - PR par chalega
  # ============================================================
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------------------------------------
      # Azure Login - Service Principal
      # --------------------------------------------------------
      - name: "Azure Login"
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "d8ced92b-b8e9-46f3-93b1-6fb7f004a13d",
              "clientSecret": "s638Q~eG70pJgTGb_b2gDlKxly-Ruzfp8Ux_.dpZ",
              "subscriptionId": "09313c5c-930a-453c-a90c-32ef23577e6b",
              "tenantId": "18d71235-29d4-4066-8c1c-633f3467b508"
            }

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: "Terraform Init"
        env:
          ARM_CLIENT_ID: "d8ced92b-b8e9-46f3-93b1-6fb7f004a13d"
          ARM_CLIENT_SECRET: "s638Q~eG70pJgTGb_b2gDlKxly-Ruzfp8Ux_.dpZ"
          ARM_SUBSCRIPTION_ID: "09313c5c-930a-453c-a90c-32ef23577e6b"
          ARM_TENANT_ID: "18d71235-29d4-4066-8c1c-633f3467b508"
          ARM_USE_CLI: "false"
          ARM_USE_AZUREAD: "true"
        run: terraform init -reconfigure

      - name: "Terraform Validate"
        env:
          ARM_CLIENT_ID: "d8ced92b-b8e9-46f3-93b1-6fb7f004a13d"
          ARM_CLIENT_SECRET: "s638Q~eG70pJgTGb_b2gDlKxly-Ruzfp8Ux_.dpZ"
          ARM_SUBSCRIPTION_ID: "09313c5c-930a-453c-a90c-32ef23577e6b"
          ARM_TENANT_ID: "18d71235-29d4-4066-8c1c-633f3467b508"
          ARM_USE_CLI: "false"
          ARM_USE_AZUREAD: "true"
        run: terraform validate

      - name: "Terraform Plan"
        id: plan
        env:
          ARM_CLIENT_ID: "d8ced92b-b8e9-46f3-93b1-6fb7f004a13d"
          ARM_CLIENT_SECRET: "s638Q~eG70pJgTGb_b2gDlKxly-Ruzfp8Ux_.dpZ"
          ARM_SUBSCRIPTION_ID: "09313c5c-930a-453c-a90c-32ef23577e6b"
          ARM_TENANT_ID: "18d71235-29d4-4066-8c1c-633f3467b508"
          ARM_USE_CLI: "false"
          ARM_USE_AZUREAD: "true"
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: "Upload Plan Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

      - name: "Comment Plan on PR"
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const planOutput = `${{ steps.plan.outputs.stdout }}`;

            const summary = planOutput
              .split('\n')
              .filter(line =>
                line.includes('Plan:') ||
                line.includes('Changes to') ||
                line.includes('No changes')
              )
              .join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🧾 Terraform Plan Summary

            \`\`\`hcl
            ${summary}
            \`\`\`

            ✅ Plan generated successfully.
            Merge this PR to apply the changes.`
            });

  # ============================================================
  # Job 2: Terraform Apply - main branch par push par chalega
  # ============================================================
  terraform-apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: "production"

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------------------------------------
      # Azure Login - Service Principal
      # --------------------------------------------------------
      - name: "Azure Login"
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "d8ced92b-b8e9-46f3-93b1-6fb7f004a13d",
              "clientSecret": "s638Q~eG70pJgTGb_b2gDlKxly-Ruzfp8Ux_.dpZ",
              "subscriptionId": "09313c5c-930a-453c-a90c-32ef23577e6b",
              "tenantId": "18d71235-29d4-4066-8c1c-633f3467b508"
            }

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: "Terraform Init"
        env:
          ARM_CLIENT_ID: "d8ced92b-b8e9-46f3-93b1-6fb7f004a13d"
          ARM_CLIENT_SECRET: "s638Q~eG70pJgTGb_b2gDlKxly-Ruzfp8Ux_.dpZ"
          ARM_SUBSCRIPTION_ID: "09313c5c-930a-453c-a90c-32ef23577e6b"
          ARM_TENANT_ID: "18d71235-29d4-4066-8c1c-633f3467b508"
          ARM_USE_CLI: "false"
          ARM_USE_AZUREAD: "true"
        run: terraform init -reconfigure

      # --------------------------------------------------------
      # 🔥 NEW STEP: Generate Plan in Apply Job
      # --------------------------------------------------------
      - name: "Terraform Plan for Apply"
        id: plan
        env:
          ARM_CLIENT_ID: "d8ced92b-b8e9-46f3-93b1-6fb7f004a13d"
          ARM_CLIENT_SECRET: "s638Q~eG70pJgTGb_b2gDlKxly-Ruzfp8Ux_.dpZ"
          ARM_SUBSCRIPTION_ID: "09313c5c-930a-453c-a90c-32ef23577e6b"
          ARM_TENANT_ID: "18d71235-29d4-4066-8c1c-633f3467b508"
          ARM_USE_CLI: "false"
          ARM_USE_AZUREAD: "true"
        run: terraform plan -out=tfplan

      # --------------------------------------------------------
      # 🔥 MODIFIED: Apply using the generated plan
      # --------------------------------------------------------
      - name: "Terraform Apply"
        env:
          ARM_CLIENT_ID: "d8ced92b-b8e9-46f3-93b1-6fb7f004a13d"
          ARM_CLIENT_SECRET: "s638Q~eG70pJgTGb_b2gDlKxly-Ruzfp8Ux_.dpZ"
          ARM_SUBSCRIPTION_ID: "09313c5c-930a-453c-a90c-32ef23577e6b"
          ARM_TENANT_ID: "18d71235-29d4-4066-8c1c-633f3467b508"
          ARM_USE_CLI: "false"
          ARM_USE_AZUREAD: "true"
        run: terraform apply -auto-approve tfplan

      # --------------------------------------------------------
      # Terraform Outputs
      # --------------------------------------------------------
      - name: "Get Outputs"
        id: outputs
        env:
          ARM_CLIENT_ID: "d8ced92b-b8e9-46f3-93b1-6fb7f004a13d"
          ARM_CLIENT_SECRET: "s638Q~eG70pJgTGb_b2gDlKxly-Ruzfp8Ux_.dpZ"
          ARM_SUBSCRIPTION_ID: "09313c5c-930a-453c-a90c-32ef23577e6b"
          ARM_TENANT_ID: "18d71235-29d4-4066-8c1c-633f3467b508"
          ARM_USE_CLI: "false"
          ARM_USE_AZUREAD: "true"
        run: |
          echo "outputs=$(terraform output -json)" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: "Print Outputs"
        if: steps.outputs.outputs != ''
        run: |
          echo "## 📋 Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.outputs.outputs }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
