name: "Terraform CI/CD Pipeline"

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.0"

jobs:
  # ============================================================
  # JOB 1: Terraform Plan + Security Checks
  # Runs only on Pull Request
  # ============================================================
  terraform-plan:
    name: "Terraform Plan & Security Scan"

    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    steps:
      # ========================================================
      # 1. Checkout Code
      # ========================================================
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # ========================================================
      # 2. Gitleaks - Secret Detection
      # ========================================================
      - name: "Gitleaks Secret Scan"
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================
      # 3. Setup Terraform
      # ========================================================
      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ========================================================
      # 4. Terraform Format Check
      # ========================================================
      - name: "Terraform Format Check"
        run: terraform fmt -check -recursive

      # ========================================================
      # 5. Setup TFLint
      # ========================================================
      - name: "Setup TFLint"
        uses: terraform-linters/setup-tflint@v5

      # ========================================================
      # 6. TFLint Init
      # ========================================================
      - name: "TFLint Init"
        run: tflint --init

      # ========================================================
      # 7. TFLint Scan
      # ========================================================
      - name: "TFLint Scan"
        run: tflint --recursive

      # ========================================================
      # 8. Azure Login
      # ========================================================
      - name: "Azure Login"
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # ========================================================
      # 9. Terraform Init
      # ========================================================
      - name: "Terraform Init"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_CLI: "false"
          ARM_USE_AZUREAD: "true"

        run: terraform init -reconfigure

      # ========================================================
      # 10. Terraform Validate
      # ========================================================
      - name: "Terraform Validate"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_CLI: "false"
          ARM_USE_AZUREAD: "true"

        run: terraform validate

      # ========================================================
      # 11. tfsec - Terraform Security Scan
      # ========================================================
      - name: "tfsec Security Scan"
        uses: aquasecurity/tfsec-action@v1.0.3

      # ========================================================
      # 12. Terraform Plan
      # ========================================================
      - name: "Terraform Plan"
        id: plan

        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_CLI: "false"
          ARM_USE_AZUREAD: "true"

        run: |
          terraform plan \
            -no-color \
            -out=tfplan

      # ========================================================
      # 13. Upload Terraform Plan
      # ========================================================
      - name: "Upload Terraform Plan"
        uses: actions/upload-artifact@v4

        with:
          name: terraform-plan
          path: tfplan

      # ========================================================
      # 14. Show Plan Summary in GitHub
      # ========================================================
      - name: "Terraform Plan Summary"

        run: |

          echo "## 🧾 Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY

          terraform show -no-color tfplan >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Security Checks" >> $GITHUB_STEP_SUMMARY

          echo "✅ Gitleaks - Secret Scan completed" >> $GITHUB_STEP_SUMMARY

          echo "✅ TFLint - Code Quality Scan completed" >> $GITHUB_STEP_SUMMARY

          echo "✅ tfsec - Security Scan completed" >> $GITHUB_STEP_SUMMARY

          echo "✅ Terraform Validate completed" >> $GITHUB_STEP_SUMMARY

          echo "✅ Terraform Plan completed" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 2: Terraform Apply
  # Runs only when code is pushed to main
  # ============================================================
  terraform-apply:
    name: "Terraform Apply"

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: "production"

    steps:
      # ========================================================
      # 1. Checkout Code
      # ========================================================
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # ========================================================
      # 2. Setup Terraform
      # ========================================================
      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3

        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ========================================================
      # 3. Azure Login
      # ========================================================
      - name: "Azure Login"
        uses: azure/login@v2

        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # ========================================================
      # 4. Terraform Init
      # ========================================================
      - name: "Terraform Init"

        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_CLI: "false"
          ARM_USE_AZUREAD: "true"

        run: terraform init -reconfigure

      # ========================================================
      # 5. Terraform Validate
      # ========================================================
      - name: "Terraform Validate"

        run: terraform validate

      # ========================================================
      # 6. TFLint
      # ========================================================
      - name: "Setup TFLint"
        uses: terraform-linters/setup-tflint@v5

      - name: "TFLint Init"
        run: tflint --init

      - name: "TFLint Scan"
        run: tflint --recursive

      # ========================================================
      # 7. tfsec Security Scan
      # ========================================================
      - name: "tfsec Security Scan"
        uses: aquasecurity/tfsec-action@v1.0.3

      # ========================================================
      # 8. Terraform Plan
      # ========================================================
      - name: "Terraform Plan"

        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_CLI: "false"
          ARM_USE_AZUREAD: "true"

        run: |
          terraform plan \
            -out=tfplan

      # ========================================================
      # 9. Terraform Apply
      # ========================================================
      - name: "Terraform Apply"

        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_CLI: "false"
          ARM_USE_AZUREAD: "true"

        run: |
          terraform apply \
            -auto-approve \
            tfplan

      # ========================================================
      # 10. Terraform Outputs
      # ========================================================
      - name: "Get Terraform Outputs"

        id: outputs

        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_USE_CLI: "false"
          ARM_USE_AZUREAD: "true"

        run: |
          terraform output -json > terraform-outputs.json

      # ========================================================
      # 11. Show Outputs
      # ========================================================
      - name: "Print Terraform Outputs"

        run: |

          echo "## 📋 Terraform Outputs" >> $GITHUB_STEP_SUMMARY

          echo '```json' >> $GITHUB_STEP_SUMMARY

          cat terraform-outputs.json >> $GITHUB_STEP_SUMMARY

          echo '```' >> $GITHUB_STEP_SUMMARY
